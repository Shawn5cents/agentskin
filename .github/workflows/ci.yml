name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  agentskin:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    name: AgentSkin release gate
    runs-on: [self-hosted, Linux, X64, agentskin-ci]
    defaults:
      run:
        working-directory: agentskin

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agentskin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run prepublishOnly
      - run: npm pack --dry-run 2>&1 | tee pack-output.txt
      - run: grep -q 'backend/mcp.js' pack-output.txt
      - run: grep -q 'suite/agent-optimizer.mjs' pack-output.txt
